<h1>Notes</h1>

<form method="GET">
    <input type="text" name="search" placeholder="Search notes...">
    <button type="submit">Search</button>
</form>

<p>Logged in as {{ request.user.username }}</p>

<form method="POST" action="{% url 'logout' %}">
    {%csrf_token%}
    <button type="submit">Logout</button>
</form>

<h2>Write a new note</h2>

<form method="post">
    {% csrf_token %}
    <input type="text" name="title" placeholder="Title" required>
    <br>
    <textarea name="content" placeholder="Write your note here..." required></textarea>
    <br>
    <button type="submit">Save</button>
</form>

<h2>My notes</h2>
{% for note in notes %}
    <h3>{{ note.title }}</h3>
    <p>{{ note.content }}</p>
{% empty %}
    <p>No notes yet.</p>
{% endfor %}
